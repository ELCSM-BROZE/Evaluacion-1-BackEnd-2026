{% extends "base.html" %}
{% block title %}Clientes{% endblock %}
{% block content %}
<h1>Clientes</h1>
<div class="actions"><a class="btn" href="{% url 'inventario:cliente_create' %}">Nuevo cliente</a><form method="get"><input name="q" value="{{ query }}" placeholder="Buscar por RUT o nombre"></form></div>
<table><tr><th>RUT</th><th>Nombre</th><th>Acciones</th></tr>
{% for cliente in clientes %}<tr><td>{{ cliente.rut }}</td><td>{{ cliente.nombre }}</td><td><a href="{% url 'inventario:cliente_update' cliente.pk %}">Editar</a> | <a href="{% url 'inventario:cliente_delete' cliente.pk %}">Eliminar</a></td></tr>
{% empty %}<tr><td colspan="3">No hay clientes.</td></tr>{% endfor %}</table>
{% endblock %}
